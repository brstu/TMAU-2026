name: Check branch name
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Не запускать, если изменены ТОЛЬКО .md файлы
    paths-ignore:
      - '**/*.md'
jobs:
  check:
    # Запускать задачу только если в названии PR нет [doc]
    if: "!startsWith(github.event.pull_request.title, '[doc]')"
    runs-on: ubuntu-latest
    steps:
      - name: Get branch names
        id: branch-name
        uses: tj-actions/branch-names@v7
      - name: Current branch name
        if: ${{steps.branch-name.outputs.current_branch == 'main' || steps.branch-name.outputs.current_branch == 'master' }}
        uses: actions/github-script@v3
        with:
         script: |
          core.setFailed('Branch should not be main')
